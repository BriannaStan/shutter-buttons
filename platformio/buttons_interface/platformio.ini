; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; micro-ROS for ROS2 Jazzy
;
; See more information about the metro m4 board and PIO here:
; https://docs.platformio.org/en/latest/boards/atmelsam/adafruit_metro_m4_airliftlite.html

[env:metro]
platform = atmelsam
board = adafruit_metro_m4_airliftlite
framework = arduino

build_flags =
    -std=gnu++14
    -DMICRO_ROS_TRANSPORT_ARDUINO_SERIAL

lib_deps =
    https://github.com/micro-ROS/micro_ros_platformio
    https://github.com/adafruit/Adafruit_NeoPixel.git#1.3.4
    https://github.com/adafruit/Adafruit_NeoPXL8.git#1.0.4
    https://github.com/adafruit/Adafruit_ZeroDMA.git#1.0.4
    https://github.com/adafruit/Adafruit_NeoPixel_ZeroDMA.git#1.1.1

; micro-ROS configuration
board_microros_distro = jazzy
board_microros_transport = serial

; Custom messages (shutter_buttons_msgs) live in extra_packages/
; and are picked up automatically by the micro-ROS PlatformIO plugin.
