;PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; See more information about the metro m4 board and PIO here:
; https://docs.platformio.org/en/latest/boards/atmelsam/adafruit_metro_m4_airliftlite.html

[env:metro]
platform = atmelsam
board = adafruit_metro_m4_airliftlite
framework = arduino
build_flags = -std=c++11

lib_deps = 
    https://github.com/adafruit/Adafruit_NeoPixel.git#1.3.4
    https://github.com/adafruit/Adafruit_NeoPXL8.git#1.0.4
    https://github.com/adafruit/Adafruit_ZeroDMA.git#1.0.4
    https://github.com/adafruit/Adafruit_NeoPixel_ZeroDMA.git#1.1.1